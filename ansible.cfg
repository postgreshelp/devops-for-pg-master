# ansible.cfg — Ansible configuration file
#
# Sets project-wide defaults so you don't repeat the same flags on every command.
# Ansible reads this file automatically when you run any ansible or ansible-playbook
# command from a directory that contains it — no flag needed to load it.
#
# ── CONFIGURATION FILE RESOLUTION ORDER ──────────────────────────────────────
# Ansible looks for its config in this order (first match wins):
#
#   1. ANSIBLE_CONFIG environment variable  (e.g. export ANSIBLE_CONFIG=/path/to/file)
#   2. ./ansible.cfg                        ← THIS FILE — project-level (recommended)
#   3. ~/.ansible.cfg                       ← user-level
#   4. /etc/ansible/ansible.cfg             ← system-wide default
#
# Using a project-level ansible.cfg (option 2) means:
#   - settings are version-controlled alongside your playbooks
#   - different projects can have different settings without conflict
#   - any team member who clones the repo gets the same behaviour automatically
#
# ── VERIFY WHICH CONFIG FILE IS ACTIVE ───────────────────────────────────────
# Run this to confirm Ansible picked up THIS file and not a system-wide one:
#
#   ansible --version
#
# Look for:  config file = /path/to/your/project/ansible.cfg
# If it shows /etc/ansible/ansible.cfg — Ansible did not find your project file.
#
# ── ALL AVAILABLE SECTIONS ────────────────────────────────────────────────────
# ansible.cfg uses INI format. Common sections (only [defaults] is used here):
#
#   [defaults]              general behaviour — inventory, logging, timeouts
#   [privilege_escalation]  sudo/become settings (become=true, become_user=root)
#   [ssh_connection]        SSH tuning — pipelining, control_path, retries
#   [persistent_connection] network device connection settings
#   [inventory]             inventory plugin config
#
# ─────────────────────────────────────────────────────────────────────────────

[defaults]

# ── inventory ─────────────────────────────────────────────────────────────────
# Tells Ansible WHERE to find the list of hosts and groups.
#
# inventory = ./inventory/hosts
#  │                │
#  │                └── path to the inventory file, relative to this ansible.cfg
#  └── without this setting you must pass -i ./inventory/hosts on every command:
#        ansible-playbook -i ./inventory/hosts playbooks/postgresql_admin.yml
#      with this setting, that flag is no longer needed.
#
# The inventory path can also point to a DIRECTORY (dynamic inventory)
# or a script — but for this lab we use a simple static hosts file.
#
# VERIFY:  ansible-inventory --graph
#   Shows the full group/host tree Ansible built from this inventory file.
#   Useful to confirm hosts are in the groups you expect before running a playbook.
inventory = ./inventory/hosts

# ── host_key_checking ────────────────────────────────────────────────────────
# Controls whether Ansible verifies the SSH fingerprint of a host before connecting.
#
# host_key_checking = False
#   ↓
#   Ansible skips the "Are you sure you want to continue connecting?" prompt.
#   Safe for lab environments where hosts are ephemeral and change often.
#
# host_key_checking = True  (production default)
#   ↓
#   Ansible checks ~/.ssh/known_hosts. If the host's fingerprint is not there
#   or does not match, the connection is refused — protects against
#   man-in-the-middle attacks where a rogue server pretends to be your target.
#
# In this lab, ansible_connection=local is used (see inventory/hosts),
# so SSH is not involved at all — but the setting is shown here for awareness.
host_key_checking = False
