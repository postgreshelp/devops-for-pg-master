# liquibase.properties — Liquibase connection configuration
# Liquibase reads this file automatically when you run any liquibase command
# from the directory that contains it (the liquibase/ folder).
#
# Think of this as the equivalent of ansible.cfg + group_vars for Liquibase:
# connection details live here, changelog logic lives in the changelog files.
#
# url format:
#   jdbc:postgresql://<host>:<port>/<database>
#    │         │
#    │         └── database type (determines which JDBC driver to use)
#    └── Java Database Connectivity — the standard Java API for DB connections
#
# Liquibase uses JDBC, so it needs:
#   1. The JDBC URL   (where to connect)
#   2. username       (who to connect as)
#   3. password       (credential)
#   4. changelog-file (what changes to track and apply)
#   AND the PostgreSQL JDBC driver jar in the lib/ folder

# The Aurora RDS endpoint — same host used in group_vars/postgresql.yml
url: jdbc:postgresql://bt01-aurora-instance-1.cijxwe4ckz1m.us-east-1.rds.amazonaws.com:5432/postgres

# LAB ONLY — use environment variables or Secrets Manager in production:
#   LIQUIBASE_COMMAND_USERNAME / LIQUIBASE_COMMAND_PASSWORD
username: postgres
password: postgres

# The master changelog — Liquibase starts here and follows include directives
# to find the individual changeset files in the changelog/ folder.
changelog-file: db.changelog-master.yaml
